# =====================================================================
# CrediSan Control · despliegue automático al VPS
# =====================================================================
# Cada vez que cambie algo dentro de credisan-control/public/, GitHub
# copia los archivos al VPS por SSH y Caddy los sirve al instante.
#
# Toca EXCLUSIVAMENTE /opt/proyectos/credisan-control/public/.
# No se acerca a centro, comprainteligente, sinfiltroconmax ni
# cambiosganancia, que viven en el mismo servidor.
#
# Necesita tres secretos en GitHub (Settings → Secrets and variables →
# Actions). Ver credisan-control/docs/DESPLIEGUE_AUTOMATICO.md
# =====================================================================

name: Desplegar CrediSan Control

on:
  push:
    branches:
      - main
      - claude/practical-maxwell-2ihoma
    paths:
      - 'credisan-control/public/**'
      - '.github/workflows/desplegar-credisan.yml'
  workflow_dispatch:
  workflow_call:      # lo llama «Poner en marcha CrediSan»

concurrency:
  group: despliegue-credisan
  cancel-in-progress: false      # dos despliegues a la vez dejarían la web a medias

env:
  DESTINO: /opt/proyectos/credisan-control/public

jobs:
  desplegar:
    runs-on: ubuntu-latest
    timeout-minutes: 10        # si el VPS no contesta, se corta y se avisa
    steps:
      - name: Traer el código
        uses: actions/checkout@v4

      - name: ¿Están las credenciales del servidor?
        id: credenciales
        run: |
          if [ -z "${{ secrets.VPS_HOST }}" ] || [ -z "${{ secrets.VPS_SSH_KEY }}" ]; then
            echo "listas=no" >> $GITHUB_OUTPUT
            {
              echo "### Falta configurar el despliegue"
              echo ""
              echo "Añada estos secretos en **Settings → Secrets and variables → Actions**:"
              echo ""
              echo "| Secreto | Valor |"
              echo "|---|---|"
              echo "| \`VPS_HOST\` | la IP del VPS |"
              echo "| \`VPS_USER\` | el usuario con el que entra por SSH |"
              echo "| \`VPS_SSH_KEY\` | la llave privada de despliegue (contenido completo) |"
              echo ""
              echo "Hecho eso, vuelva aquí y pulse **Re-run jobs**."
            } >> $GITHUB_STEP_SUMMARY
            echo "Sin credenciales: no hay nada que publicar todavía."
          else
            echo "listas=si" >> $GITHUB_OUTPUT
          fi

      - name: Comprobar que no se publica configuración con claves
        if: steps.credenciales.outputs.listas == 'si'
        run: |
          # En el repositorio, config/env.js viaja VACÍO a propósito. El del
          # servidor tiene las claves reales y está excluido del envío. Esta
          # comprobación evita que alguien acabe subiendo claves a GitHub.
          if grep -qE "supabaseAnonKey:\s*'[^']+'" credisan-control/public/config/env.js; then
            echo "::error::config/env.js del repositorio lleva una clave. Vacíela antes de publicar."
            exit 1
          fi
          echo "Configuración limpia."

      - name: Preparar la llave de acceso
        if: steps.credenciales.outputs.listas == 'si'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh

          # Si la llave se cargó desde Windows, viene con retornos de carro
          # y puede traer marca de orden de bytes. OpenSSL la rechaza con un
          # escueto "error in libcrypto". Se normaliza antes de usarla.
          printf '%s' "${{ secrets.VPS_SSH_KEY }}" \
            | tr -d '\r' \
            | sed '1s/^\xEF\xBB\xBF//' > ~/.ssh/id_despliegue
          # Toda llave debe terminar en salto de línea. El `|| true` importa:
          # con `set -e`, un `&&` que no se cumple mataría el paso.
          [ -n "$(tail -c1 ~/.ssh/id_despliegue)" ] && echo >> ~/.ssh/id_despliegue || true
          chmod 600 ~/.ssh/id_despliegue

          # Comprobar aquí y decirlo en castellano, en vez de fallar luego
          # con un mensaje de OpenSSL que no explica nada.
          if ! ssh-keygen -y -f ~/.ssh/id_despliegue > /dev/null 2>&1; then
            {
              echo "### La llave de despliegue no es válida"
              echo ""
              echo "El secreto \`VPS_SSH_KEY\` no contiene una llave privada que OpenSSH pueda leer."
              echo ""
              echo "Causas habituales:"
              echo "- Se cargó el archivo \`.pub\` (la llave pública) en vez del privado"
              echo "- Se copió sólo una parte: debe ir desde \`-----BEGIN\` hasta \`-----END\` incluidos"
              echo "- PowerShell la guardó en UTF-16. Cárguela con:"
              echo "  \`gh secret set VPS_SSH_KEY --repo maxmuru47-hash/la-noticia-sin-filtro --body (Get-Content \$env:USERPROFILE\\.ssh\\credisan_despliegue -Raw)\`"
            } >> $GITHUB_STEP_SUMMARY
            echo "::error::VPS_SSH_KEY no es una llave privada legible. Vea el resumen del flujo."
            exit 1
          fi
          echo "Llave válida: $(ssh-keygen -l -f ~/.ssh/id_despliegue | awk '{print $1, $4}')"

          # Anotar la huella del servidor. Si el cortafuegos no deja hacer el
          # sondeo, no es motivo para abortar: se acepta la huella en la
          # primera conexión. La autenticación sigue dependiendo de la llave.
          touch ~/.ssh/known_hosts
          ssh-keyscan -T 10 -p "${{ secrets.VPS_PORT || 22 }}" -H "${{ secrets.VPS_HOST }}" \
            >> ~/.ssh/known_hosts 2>/dev/null || true
          chmod 600 ~/.ssh/known_hosts

          # Topes de conexión. Sin ellos, un servidor apagado no da error:
          # deja la conexión esperando, y el despliegue se queda colgado
          # horas sin decir por qué. Con esto falla en 20 segundos.
          LIMITES="-o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4"

          if [ -s ~/.ssh/known_hosts ]; then
            echo "SSH=-i $HOME/.ssh/id_despliegue -p ${{ secrets.VPS_PORT || 22 }} $LIMITES" >> $GITHUB_ENV
            echo "Huella del servidor anotada."
          else
            echo "SSH=-i $HOME/.ssh/id_despliegue -p ${{ secrets.VPS_PORT || 22 }} $LIMITES -o StrictHostKeyChecking=accept-new" >> $GITHUB_ENV
            echo "No se pudo sondear la huella; se aceptará en la primera conexión."
          fi

      - name: Respaldar lo que está en producción
        if: steps.credenciales.outputs.listas == 'si'
        run: |
          # Antes de tocar nada, una copia con fecha. Volver atrás es
          # descomprimir un archivo, no rehacer el trabajo.
          ssh $SSH "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "cd /opt/proyectos/credisan-control && \
             tar -czf respaldo-\$(date +%Y%m%d-%H%M).tar.gz public && \
             ls -1t respaldo-*.tar.gz | tail -n +11 | xargs -r rm --"
          echo "Respaldo hecho (se conservan los 10 últimos)."

      - name: Publicar
        if: steps.credenciales.outputs.listas == 'si'
        run: |
          # --delete borra del servidor lo que ya no exista en el repositorio,
          # pero NUNCA lo excluido: config/env.js se queda intacto.
          rsync -az --delete \
            --exclude 'config/env.js' \
            --exclude '.htaccess' \
            --exclude '.DS_Store' \
            -e "ssh $SSH" \
            credisan-control/public/ \
            "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:$DESTINO/"

      - name: Devolver los permisos a Caddy
        if: steps.credenciales.outputs.listas == 'si'
        run: |
          ssh $SSH "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" \
            "chown -R caddy:caddy $DESTINO 2>/dev/null || sudo chown -R caddy:caddy $DESTINO"

      - name: Comprobar que la web responde
        if: steps.credenciales.outputs.listas == 'si'
        run: |
          fallos=0
          for ruta in / /panel/ /kiosk/ /sw.js; do
            codigo=$(curl -s -o /dev/null -w '%{http_code}' "https://control.sinfiltroconmax.com$ruta")
            echo "$ruta → HTTP $codigo"
            [ "$codigo" = "200" ] || fallos=$((fallos+1))
          done
          if [ "$fallos" -gt 0 ]; then
            echo "::error::$fallos ruta(s) no responden 200. Revise el respaldo en el VPS."
            exit 1
          fi
          {
            echo "### CrediSan Control publicado"
            echo ""
            echo "https://control.sinfiltroconmax.com — portada, panel, terminal y service worker responden."
            echo ""
            echo "\`config/env.js\` del servidor no se tocó."
          } >> $GITHUB_STEP_SUMMARY

      # Un despliegue que falla y no explica nada obliga a leer registros.
      # Este paso traduce el fallo más probable: el servidor no contestó.
      - name: Explicar el fallo
        if: failure() && steps.credenciales.outputs.listas == 'si'
        run: |
          {
            echo "### El despliegue no pudo completarse"
            echo ""
            echo "La causa más frecuente, con diferencia, es que **el VPS no contestó**."
            echo "La llave ya se validó antes de intentar conectar, así que el problema"
            echo "no está en las credenciales."
            echo ""
            echo "Qué comprobar, en este orden:"
            echo ""
            echo "1. Que el VPS esté encendido en el panel de su proveedor."
            echo "2. Que el servicio SSH esté vivo y escuchando en el puerto configurado."
            echo "3. Que el cortafuegos no haya empezado a bloquear a GitHub."
            echo ""
            echo "Sobre la web que ya estaba publicada:"
            echo ""
            echo "- Si falló **antes** del paso «Publicar» —que es lo habitual cuando el"
            echo "  servidor no contesta—, en el VPS sigue exactamente lo que había."
            echo "- Si falló **durante** «Publicar», la copia pudo quedarse a medias. Para"
            echo "  eso está el respaldo con fecha que se hizo justo antes, en"
            echo "  \`/opt/proyectos/credisan-control/respaldo-*.tar.gz\`."
            echo ""
            echo "Mire arriba qué paso salió en rojo: eso dice en cuál de los dos casos está."
            echo ""
            echo "Cuando el VPS vuelva, basta con volver a lanzar este mismo flujo desde"
            echo "«Re-run jobs». Es idempotente: copiar otra vez lo mismo no rompe nada."
          } >> $GITHUB_STEP_SUMMARY

      - name: Recoger la llave
        if: always()
        run: rm -f ~/.ssh/id_despliegue
